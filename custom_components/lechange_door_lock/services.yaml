open_door_remote:
  name: Remote open door
  description: Remotely unlock the door lock (iot.control.SetService remoteOpenDoor).
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:

wake_up_device:
  name: Wake up device
  description: Try to wake a sleeping door lock (clears the dormant flags).
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:

call_answer:
  name: Answer doorbell call
  description: Answer the doorbell call (CallAnswer).
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    user_info:
      name: User info
      description: Call context received in the lechange_door_lock_event doorbell_call event.
      required: false
      default: ""
      selector:
        text:

call_refuse:
  name: Refuse doorbell call
  description: Refuse the doorbell call (CallRefuse).
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    index:
      name: Index
      description: Call index (0-255).
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          step: 1
    user_info:
      name: User info
      description: Call context received in the event.
      required: false
      default: ""
      selector:
        text:

call_hangup:
  name: Hang up doorbell call
  description: Hang up the doorbell call (CallHangup).
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    user_info:
      name: User info
      description: Call context received in the event.
      required: false
      default: ""
      selector:
        text:

get_voice_reply:
  name: Get voice replies
  description: Fetch the voice reply list (GetVoiceReply), result is fired as lechange_door_lock_event voice_reply_list.
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    relate_type:
      name: Relate type
      description: "0 device / 1 accessory / 2 reply / 3 local / 4 quickReply / 5 chime"
      required: false
      default: 4
      selector:
        select:
          options:
            - label: quickReply
              value: 4
            - label: reply
              value: 2
            - label: device
              value: 0
            - label: accessory
              value: 1
            - label: local
              value: 3
            - label: chime
              value: 5

set_voice_reply:
  name: Set voice reply
  description: Select the automatic voice reply for the doorbell (SetVoiceReply).
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    index:
      name: Index
      description: Reply index from get_voice_reply (0-256).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 256
          step: 1
    relate_type:
      name: Relate type
      description: Reply category (default quickReply).
      required: false
      default: 4
      selector:
        select:
          options:
            - label: quickReply
              value: 4
            - label: reply
              value: 2
            - label: device
              value: 0
            - label: accessory
              value: 1
            - label: local
              value: 3
            - label: chime
              value: 5
    time_stab:
      name: Time stamp
      description: Request timestamp (0-999999).
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999999
          step: 1

create_snapkey:
  name: Create temporary password
  description: Generate a temporary password (CreateDeviceSnapkey), result is fired as lechange_door_lock_event snapkey_created.
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    name:
      name: Key name
      description: Name of the key.
      required: true
      example: "Guest key"
      selector:
        text:
    effect_times:
      name: Effect days
      description: Number of days the key is valid (-1 unlimited / 1-90).
      required: false
      default: 1
      selector:
        number:
          min: -1
          max: 90
          step: 1
    number:
      name: Use limit
      description: Number of times the key can be used (-1 unlimited / 1-255).
      required: false
      default: 1
      selector:
        number:
          min: -1
          max: 255
          step: 1

get_snapkey_list:
  name: Get temporary password list
  description: Fetch the temporary password list (GetDeviceSnapkeys), result is fired as lechange_door_lock_event snapkey_list.
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    offset:
      name: Offset
      description: Start position (0-255).
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          step: 1
    count:
      name: Count
      description: How many entries (1-255).
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 255
          step: 1

get_open_door_record:
  name: Get open door records
  description: Retrieve recent door open records from the lockNoteReport property, fired as lechange_door_lock_event open_door_records.
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:

delete_snapkey:
  name: Delete temporary password
  description: Remove a temporary password (iot.message.SmartLockSecretDelete, message domain; pass full fields via extra for reliable removal).
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    key_id:
      name: Key ID
      description: Key id of the temporary password (from refresh_snapkey_list / snapkey list).
      required: true
      example: 67330355
      selector:
        number:
          min: 0
          max: 999999999
          step: 1
    extra:
      name: Extra fields
      description: Optional full key fields (type/name/group/usagePeriod...) for reliable deletion.
      required: false
      default: {}
      selector:
        object:

set_properties:
  name: Set properties
  description: Generic IoT property write (iot.control.SetProperties).
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    properties:
      name: Properties
      description: 'Map of property identifier to value, e.g. {"child_lock": true}.'
      required: true
      example: '{"child_lock": true}'
      selector:
        object:

call_service:
  name: Call IoT service
  description: Generic IoT service call (iot.control.SetService) for advanced usage.
  fields:
    device_id:
      name: Device ID
      description: The device serial number.
      required: true
      example: "600EBBDRSF00000"
      selector:
        text:
    service_name:
      name: Service name
      description: Service identifier from the device model (e.g. StorageFormat, SetVoiceReply).
      required: true
      example: "GetStorageCapacity"
      selector:
        text:
    input_data:
      name: Input data
      description: Service input parameters.
      required: false
      default: {}
      selector:
        object:
    channel_id:
      name: Channel id
      description: Channel for the service call.
      required: false
      default: ""
      selector:
        text:
